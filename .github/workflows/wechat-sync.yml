name: 微信AI分析

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ai-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装根目录依赖
        run: npm install --no-save 2>&1 | tail -3 || true

      # ===== 阶段 1：git pull 同步 watcher 推送的数据 =====
      - name: 同步远程数据
        run: git pull --rebase origin main 2>/dev/null || true

      # ===== 阶段 2：AI 分析新增条目 =====
      - name: AI 分析新增条目
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
          SILICONFLOW_MODEL: 'Qwen/Qwen2.5-72B-Instruct'
          AI_CONCURRENCY: '12'
        run: node scripts/analyze_v3.cjs --limit=100

      # ===== 阶段 3：提交 =====
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main 2>/dev/null || true
          git add regulatory-hot/public/data/ regulatory-hot/regulatory.db
          git diff --staged --quiet || git commit -m "🤖 AI分析 [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
