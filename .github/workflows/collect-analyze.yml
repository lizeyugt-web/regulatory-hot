name: FDA 采集

on:
  schedule:
    # 每 2 小时（UTC）→ 北京 08:00/10:00/12:00/14:00/16:00/18:00/20:00/22:00/00:00/02:00/04:00/06:00
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  fda-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'regulatory-hot/package-lock.json'

      - name: 安装依赖
        run: |
          cd regulatory-hot
          npm ci --prefer-offline
          cd ..
          npm ci --prefer-offline || npm install

      - name: 安装 Playwright 浏览器
        run: npx playwright install chromium 2>&1 | tail -3

      # ===== FDA 采集 =====
      - name: 采集 FDA 最新信息（RSS + FR + Web）
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
        continue-on-error: true
        run: node scripts/collect_fda.cjs

      # ===== AI 分析 FDA 新条目 =====
      - name: AI 分析新增条目 (v3.0 DB)
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
          SILICONFLOW_MODEL: 'Qwen/Qwen2.5-72B-Instruct'
          AI_CONCURRENCY: '8'
        run: node scripts/analyze_v3.cjs --limit=80

      # ===== 提交 =====
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main 2>/dev/null || true
          git add regulatory-hot/public/data/ regulatory-hot/regulatory.db regulatory-hot/prisma/
          git diff --staged --quiet || git commit -m "🤖 FDA采集 [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
